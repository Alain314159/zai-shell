apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace "com.zai.shell"
    compileSdk 36

    // Ensure BuildConfig is generated
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.zai.shell"
        minSdk 24
        targetSdk 36
        // MEDIUM #43: versionCode driven from CI env if available
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // CRITICAL #6: explicit signingConfigs block
    // The release config is wired from CI via project properties (-PzaiSigningConfig=true)
    signingConfigs {
        zaiRelease {
            // Default to debug keystore (works locally); CI overrides with permanent keystore
            storeFile file('release.keystore')
            // These come from -PzaiStorePassword etc., fallback to debug
            storePassword project.hasProperty('zaiStorePassword') ? project.ext.zaiStorePassword : 'android'
            keyAlias project.hasProperty('zaiKeyAlias') ? project.ext.zaiKeyAlias : 'androiddebugkey'
            keyPassword project.hasProperty('zaiKeyPassword') ? project.ext.zaiKeyPassword : 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // CRITICAL #29 (HIGH #9): keep debug with debug signing, not release
            // signingConfig falls back to default debug
        }
        release {
            // CRITICAL #6: sign release with the proper keystore when CI provides it
            if (project.hasProperty('zaiSigningConfig')) {
                signingConfig signingConfigs.zaiRelease
            }
            // CRITICAL #7 + GA4: R8 + resource shrinking
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // MEDIUM: AAB bundle config for Play Store
    bundle {
        density { enableSplit = true }
        abi { enableSplit = true }
        language { enableSplit = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // HIGH #34: kotlinOptions deprecated in Kotlin 2.0; use kotlin { compilerOptions }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }

    // HIGH #35: packagingOptions renamed to packaging in AGP 8
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }

    // LOW: surface test failures gracefully
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// GA4: R8 full mode - better optimization than ProGuard compatibility mode
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        // R8 full mode via project property
        project.ext.set("android.enableR8.fullMode", true)
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-haptics')
    implementation project(':capacitor-keyboard')
    implementation project(':capacitor-local-notifications')
    implementation project(':capacitor-network')
    implementation project(':capacitor-preferences')
    implementation project(':capacitor-status-bar')
    implementation project(':capacitor-splash-screen')
    implementation project(':capacitor-filesystem')
    // MEDIUM #54: removed redundant androidx.core:core (core-ktx already depends on it)
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    // OkHttp + SSE para ZaiSseBridge
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-sse:4.12.0"
    // GA1: Room (SQLite) para historial offline - reemplaza SharedPreferences JSON
    implementation "androidx.room:room-runtime:2.7.0"
    implementation "androidx.room:room-ktx:2.7.0"
    kapt "androidx.room:room-compiler:2.7.0"
    // GA7: Coroutines para plugins Kotlin
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    implementation project(':capacitor-community-keep-awake')
}

apply from: 'capacitor.build.gradle'

// google-services plugin only if the config file exists (FCM not used yet)
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.length() > 0) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied.")
}
