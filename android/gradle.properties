# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# MEDIUM #31: configure-on-demand causes inconsistent config in multi-module Capacitor projects
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
# MEDIUM #31: Jetifier unnecessary for AndroidX-only Capacitor 8 (saves 10-30% config time)
android.enableJetifier=false
android.nonTransitiveRClass=true
# MEDIUM #35: removed duplicate nonFinalResIds and deprecated defaults.buildfeatures.buildconfig

kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
