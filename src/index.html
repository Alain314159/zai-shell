<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Z.ai Shell</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      z-index: 9999;
    }
    .loader .icon {
      font-size: 64px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loader .text {
      margin-top: 16px;
      color: #3b82f6;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .loader .sub {
      margin-top: 8px;
      color: #666;
      font-size: 12px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="icon">⚡</div>
    <div class="text">Z.AI SHELL</div>
    <div class="sub">Cargando chat.z.ai...</div>
  </div>
  <script>
    // En produccion, Capacitor carga https://chat.z.ai directamente en el WebView.
    // Este HTML solo se ve si hay error de red o durante el splash inicial.
    setTimeout(function() {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.querySelector('.sub').textContent = 'Si no carga, verifica tu conexion a internet';
      }
    }, 5000);
  </script>
</body>
</html>
