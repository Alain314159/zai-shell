name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# CRITICAL #5: explicit minimum permissions; release job escalates to contents: write
permissions:
  contents: read

# HIGH #4: cancel redundant runs on same ref
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # HIGH #6: use npm ci for deterministic builds (lockfile must exist)
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure gradlew is executable
        working-directory: android
        run: chmod +x gradlew

      # =========================================================================
      # CRITICAL #4: pass keystore secret via env, not inline interpolation
      # =========================================================================
      - name: Restore permanent keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restaurando keystore permanente..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            ls -la android/app/release.keystore
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: RELEASE_KEYSTORE no configurado - usando debug signing"
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK (signed if keystore available)
        working-directory: android
        env:
          ZAI_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ZAI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ZAI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_AVAILABLE: ${{ steps.keystore.outputs.available }}
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            ./gradlew assembleRelease assembleDebug \
              -PzaiSigningConfig=true \
              -PzaiStorePassword="$ZAI_STORE_PASSWORD" \
              -PzaiKeyAlias="$ZAI_KEY_ALIAS" \
              -PzaiKeyPassword="$ZAI_KEY_PASSWORD" \
              --no-daemon --stacktrace
          else
            # No keystore - build debug only (HIGH #5: explicit fallback)
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK signature
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner"
          echo "=== APK Release signature ==="
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -10 || true

      - name: Upload release APK (signed)
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zai-shell-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zai-shell-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: zai-shell-release
          path: artifacts/release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch/Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Keystore available: ${{ steps.keystore.outputs.available }}" >> $GITHUB_STEP_SUMMARY
