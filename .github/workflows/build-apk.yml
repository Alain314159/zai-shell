name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure gradlew is executable
        working-directory: android
        run: |
          ls -la gradlew || echo "gradlew not found"
          chmod +x gradlew
          ls -la gradle/wrapper/gradle-wrapper.jar

      # =========================================================================
      # Restaurar keystore permanente para firma consistente entre builds
      # Esto permite actualizar la app sin desinstalar primero
      # =========================================================================
      - name: Restore permanent keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "Restaurando keystore permanente..."
            echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > android/app/release.keystore
            ls -la android/app/release.keystore
            echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "WARNING: RELEASE_KEYSTORE no configurado - los builds no seran actualizables"
            echo "KEYSTORE_AVAILABLE=false" >> $GITHUB_ENV
          fi

      # =========================================================================
      # Configurar signingConfigs en build.gradle con el keystore permanente
      # =========================================================================
      - name: Configure signing in build.gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          // Configuracion de firma generada por CI
          if (project.hasProperty('zaiSigningConfig')) {
              android.signingConfigs {
                  zaiRelease {
                      storeFile file('release.keystore')
                      storePassword project.ext.zaiStorePassword
                      keyAlias project.ext.zaiKeyAlias
                      keyPassword project.ext.zaiKeyPassword
                  }
              }
              android.buildTypes.release.signingConfig android.signingConfigs.zaiRelease
              android.buildTypes.debug.signingConfig android.signingConfigs.zaiRelease
          }
          EOF

      - name: Build release APK (signed)
        working-directory: android
        env:
          ZAI_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ZAI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ZAI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease assembleDebug \
            -PzaiSigningConfig=true \
            -PzaiStorePassword="$ZAI_STORE_PASSWORD" \
            -PzaiKeyAlias="$ZAI_KEY_ALIAS" \
            -PzaiKeyPassword="$ZAI_KEY_PASSWORD" \
            --no-daemon --stacktrace

      # Si no hay keystore, fallback al debug normal
      - name: Build debug APK (fallback)
        if: env.KEYSTORE_AVAILABLE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Verify APK signature
        if: env.KEYSTORE_AVAILABLE == 'true'
        working-directory: android
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1)
          echo "=== APK Release signature ==="
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | head -10 || true
          echo "=== APK Debug signature ==="
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -10 || true

      - name: Upload release APK (signed, installable over previous)
        uses: actions/upload-artifact@v4
        with:
          name: zai-shell-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zai-shell-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch/Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Keystore: ${{ env.KEYSTORE_AVAILABLE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.KEYSTORE_AVAILABLE }}" = "true" ]; then
            echo "### ✅ APK actualizable" >> $GITHUB_STEP_SUMMARY
            echo "El APK release está firmado con keystore permanente. Se puede instalar encima de versiones anteriores SIN desinstalar." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ APK no actualizable" >> $GITHUB_STEP_SUMMARY
            echo "Falta configurar RELEASE_KEYSTORE secret. Los APKs no se podrán actualizar sin desinstalar primero." >> $GITHUB_STEP_SUMMARY
          fi
